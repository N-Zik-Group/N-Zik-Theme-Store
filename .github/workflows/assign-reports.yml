name: Moderate Theme Store reports

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  moderate:
    if: startsWith(github.event.issue.title, '[REPORT] :')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const current = context.payload.issue;
            const issue = { ...context.repo, issue_number: current.number };
            const target = /^<!-- nzik-report:([a-f0-9-]{36}):(theme|reviews:\d+|review:\d+:\d+) -->$/;
            const marker = current.body?.split(/\r?\n/, 1)[0];
            const match = marker?.match(target);
            const read = async path => {
              const { data } = await github.rest.repos.getContent({ ...context.repo, path, ref: 'main' });
              return JSON.parse(Buffer.from(data.content, 'base64').toString('utf8'));
            };
            const close = async () => {
              await github.rest.issues.update({ ...issue, state: 'closed', state_reason: 'not_planned' });
            };
            const blocked = await read('catalog/creators/blocked.json');
            if (blocked.accounts.some(account => account.githubId === current.user.id)) {
              await close();
              return;
            }
            if (match?.[2] === 'theme') {
              const indexes = await Promise.all([
                'catalog/themes/index-v3.json', 'catalog/themes/index-v2.json', 'catalog/themes/index.json'
              ].map(read));
              const revisions = indexes.flatMap(index => index.themes.filter(theme => theme.themeId === match[1]));
              const latest = revisions.sort((a, b) => b.revision - a.revision)[0];
              const manifest = latest && await read('catalog/themes/' + latest.themeId + '/' + latest.revision + '/manifest.json');
              const verified = await read('catalog/creators/verified.json');
              if (!manifest || verified.githubIds.includes(manifest.author.githubId)) {
                await close();
                return;
              }
            }
            if (match) {
              const originals = await github.paginate(github.rest.issues.listForRepo, {
                ...context.repo, state: 'all', creator: current.user.login, per_page: 100
              });
              const original = originals.filter(candidate =>
                !candidate.pull_request && candidate.number < current.number &&
                candidate.user?.id === current.user.id &&
                candidate.body?.split(/\r?\n/, 1)[0] === marker
              ).sort((a, b) => a.number - b.number)[0];
              if (original) {
                await github.rest.issues.createComment({
                  ...issue, body: 'A report already exists for this target. Add your follow-up to #' + original.number + '.'
                });
                await close();
                return;
              }
            }
            try {
              await github.rest.issues.createLabel({
                ...context.repo, name: 'report', color: 'b60205',
                description: 'Reported theme or review awaiting moderation'
              });
            } catch (error) {
              if (error.status !== 422) throw error;
            }
            await github.rest.issues.addLabels({ ...issue, labels: ['report'] });
