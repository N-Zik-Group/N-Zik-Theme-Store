name: Blocked contributors
on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled, closed]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: 'Retry incomplete submission cleanup (leave empty to initialize labels)'
        required: false
        type: string
permissions:
  actions: write
  contents: write
  checks: read
  statuses: read
  issues: write
  pull-requests: write
jobs:
  labels:
    if: github.event_name == 'pull_request_target' && contains(fromJSON('["opened", "reopened", "synchronize", "ready_for_review"]'), github.event.action)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const labelSubmission = require('./.github/scripts/label_submission.cjs');
            await labelSubmission({ github, context });
  moderation:
    needs: labels
    # Label failures or skipped classification must not bypass failure reconciliation.
    if: always() && !cancelled()
    concurrency:
      # Only moderation serializes writes to main; classification never waits in this queue.
      group: theme-store-moderation-main
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - if: github.event.action == 'labeled' && github.event.label.name == 'accepted'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # An earlier queued approval may have advanced main since this event.
          ref: refs/heads/main
          path: moderation-base
          fetch-depth: 0
          persist-credentials: false
      - if: github.event.action == 'labeled' && github.event.label.name == 'accepted'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - if: github.event.action == 'labeled' && github.event.label.name == 'accepted'
        working-directory: moderation-base
        run: python -m pip install -r requirements-validation.txt
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          THEME_STORE_MERGE_TOKEN: ${{ github.token }}
          THEME_STORE_GITHUB_APP_PRIVATE_KEY: ${{ secrets.THEME_STORE_GITHUB_APP_PRIVATE_KEY }}
          THEME_STORE_CLEANUP_TOKEN: ${{ secrets.THEME_STORE_CLEANUP_TOKEN }}
        with:
          script: |
            const event = context.payload;
            const statusLabels = { 'in review': 'fbca04', accepted: '0e8a16', refused: 'd73a4a', merged: '6f42c1', ban: 'b60205' };
            const reasons = {
              'reason: explicit content': 'Remove the explicit material.',
              'reason: personal information': 'Remove personal information from the submitted files.',
              'reason: rights issue': 'Replace material you do not have permission to publish.',
              'reason: invalid profile': 'Correct the profile fields or images.',
              'reason: invalid theme': 'Correct the theme files or compatibility settings.',
              'reason: preview issue': 'Add the missing previews or replace inaccurate previews.',
              'reason: duplicate': 'Use the existing submission.',
              'reason: not working': 'Fix the theme and test it in N-Zik before resubmitting.',
              'reason: other': 'See the moderator’s note for details.',
              'reason: spam': 'The submission was identified as spam.',
              'reason: repeated violations': 'The account has repeatedly violated the contribution rules.'
            };
            const typeLabels = {
              'new creator profile': '1d76db',
              'update creator profile': '0052cc',
              'new theme': '0e8a16',
              'theme update': '006b75',
              'theme withdrawal': 'd93f0b',
              'theme review': '5319e7'
            };
            async function ensureLabel(name, color) {
              try {
                await github.rest.issues.createLabel({ ...context.repo, name, color });
              } catch (error) {
                if (error.status !== 422) throw error;
              }
            }
            if (context.eventName === 'workflow_dispatch') {
              const number = String(event.inputs?.pull_request_number ?? '').trim();
              if (!number) {
                for (const [name, color] of Object.entries({ ...statusLabels, ...typeLabels })) {
                  await ensureLabel(name, color);
                }
                for (const name of Object.keys(reasons)) await ensureLabel(name, 'f9d0c4');
                await ensureLabel('cleanup pending', 'd93f0b');
                return;
              }
              if (!/^[1-9]\d*$/.test(number) || !Number.isSafeInteger(Number(number))) {
                throw new Error('Enter a valid pull request number to retry cleanup.');
              }
              ({ data: event.pull_request } = await github.rest.pulls.get({ ...context.repo, pull_number: Number(number) }));
              event.action = 'cleanup_retry';
            }
            const pull = event.pull_request;
            const ref = event.repository.default_branch;
            const target = { ...context.repo, issue_number: pull.number };
            const authorOwnsHead = pull.head.repo?.owner?.id === pull.user.id;
            const isSubmission = authorOwnsHead && pull.head.ref === `nzik/creator-profile-${pull.user.id}`;
            const isThemeSubmission = authorOwnsHead
              && /^nzik\/theme-[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}$/.test(pull.head.ref);
            const withdrawalBranch = /^nzik\/withdraw-([0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12})$/.exec(pull.head.ref);
            const isWithdrawal = authorOwnsHead && Boolean(withdrawalBranch);
            const reviewBranch = authorOwnsHead && /^nzik\/review-([0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12})-([1-9]\d*)-([1-9]\d*)$/.exec(pull.head.ref);
            const isReview = authorOwnsHead && Boolean(reviewBranch) && reviewBranch[3] === String(pull.user.id);
            const reviewPath = isReview ? `catalog/themes/${reviewBranch[1]}/${reviewBranch[2]}/reviews.json` : '';
            const waitingMarker = '<!-- nzik-creator-wait ';
            function waitingState(comment) {
              if (comment.user?.login !== 'github-actions[bot]' || comment.user?.type !== 'Bot' ||
                  !comment.body?.startsWith(waitingMarker)) return null;
              try { return JSON.parse(comment.body.slice(waitingMarker.length).split(' -->')[0]); }
              catch { return null; }
            }
            async function waitingComments(number) {
              return (await github.paginate(github.rest.issues.listComments, {
                ...context.repo, issue_number: number, per_page: 100
              })).map(comment => ({ comment, state: waitingState(comment) })).filter(item => item.state);
            }
            async function saveWaiting(number, state, comment) {
              const body = waitingMarker + JSON.stringify(state) + ' -->\n' + (state.invalid
                ? 'The waiting approval was invalidated. A maintainer must review and accept this theme again.'
                : 'Theme accepted; waiting for the creator profile to be published. The approved revision will resume automatically after profile publication.');
              if (comment) await postComment({ ...context.repo, issue_number: number, comment_id: comment.id, body });
              else await postComment({ ...context.repo, issue_number: number, body });
            }
            async function approvalEvent(number) {
              const events = await github.paginate(github.rest.issues.listEvents, {
                ...context.repo, issue_number: number, per_page: 100
              });
              return events.filter(item => ['labeled', 'unlabeled'].includes(item.event) &&
                ['accepted', 'refused', 'ban'].includes(item.label?.name)).at(-1);
            }
            function sameWaitingHead(state, item) {
              const labels = new Set(item.labels.map(label => label.name));
              return !state.invalid && state.authorId === item.user.id && item.state === 'open' && !item.draft &&
                item.base.ref === 'main' && state.head === item.head.sha && state.branch === item.head.ref &&
                state.repositoryId === item.head.repo?.id && item.head.repo?.owner?.id === state.authorId &&
                labels.has('accepted') && !labels.has('refused') && !labels.has('ban');
            }
            async function waitingApprovalValid(state, item) {
              if (!sameWaitingHead(state, item)) return false;
              const latest = await approvalEvent(item.number);
              return latest?.id === state.approvalId && latest.event === 'labeled' && latest.label.name === 'accepted';
            }
            async function resumeWaitingThemes(profile) {
              if (!isSubmission || !profile.merged || profile.base.ref !== 'main') return;
              const { data: base } = await github.rest.git.getRef({ ...context.repo, ref: 'heads/main' });
              const index = JSON.parse(await readFile('catalog/creators/index.json', base.object.sha));
              const entries = index.creators?.filter(row => row.githubId === profile.user.id);
              if (index.schemaVersion !== 1 || entries?.length !== 1) return;
              const bytes = await readFile(`catalog/creators/${profile.user.id}/profile.json`, base.object.sha);
              if (require('node:crypto').createHash('sha256').update(bytes).digest('hex') !== entries[0].profileSha256 ||
                  JSON.parse(bytes).githubId !== profile.user.id) throw new Error('Invalid published creator profile.');
              const blocklist = JSON.parse(await readFile('catalog/creators/blocked.json', base.object.sha));
              if (blocklist.schemaVersion !== 1 || !Array.isArray(blocklist.accounts)) throw new Error('Invalid moderation list');
              if (blocklist.accounts.some(row => row.githubId === profile.user.id)) return;
              const open = await github.paginate(github.rest.pulls.list, { ...context.repo, state: 'open', base: 'main', per_page: 100 });
              for (const item of open) {
                if (item.user.id !== profile.user.id || !/^nzik\/theme-[0-9a-f-]{36}$/.test(item.head.ref)) continue;
                for (const { comment, state } of await waitingComments(item.number)) {
                  if (state.resumed || !Number.isSafeInteger(state.runId) || !await waitingApprovalValid(state, item)) continue;
                  const { data: run } = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: state.runId });
                  if (run.event !== 'pull_request_target' || run.path !== '.github/workflows/blocked-contributors.yml' ||
                      run.status !== 'completed') continue;
                  // Rerun the original labeled event: the existing approval path rechecks
                  // its maintainer, exact fork/head, live labels, blocklist and trusted base.
                  await github.rest.actions.reRunWorkflow({ ...context.repo, run_id: state.runId });
                  await saveWaiting(item.number, { ...state, resumed: true }, comment);
                }
              }
            }
            const labelAdded = event.action === 'labeled' ? event.label.name : '';
            if (labelAdded) {
              if ((!['accepted', 'refused', 'ban'].includes(labelAdded) && !Object.hasOwn(reasons, labelAdded)) || (pull.merged && labelAdded !== 'accepted')) return;
              const { data: access } = await github.rest.repos.getCollaboratorPermissionLevel({
                ...context.repo, username: event.sender.login
              });
              if (!['admin', 'maintain', 'write'].includes(access.permission)) return;
            }
            // Keep comments deliverable after publication/refusal has locked the PR.
            async function postComment(args) {
              // GitHub also rejects PATCH of an existing bot comment on locked
              // issues, with the misleading "Unable to create comment" message.
              const { issue_number = pull.number, comment_id, ...parameters } = args;
              const issue = { ...context.repo, issue_number };
              let { data: item } = await github.rest.issues.get(issue);
              let restoreLock = Boolean(item.locked);
              let lockReason = item.active_lock_reason;
              const write = () => comment_id
                ? github.rest.issues.updateComment({ ...parameters, comment_id })
                : github.rest.issues.createComment({ ...parameters, issue_number });
              let lockedResponse = false;
              try {
                for (let attempt = 0; attempt < 5; attempt++) {
                  if (item.locked || lockedResponse) {
                    restoreLock = true;
                    lockReason ??= item.active_lock_reason;
                    await github.rest.issues.unlock(issue);
                    // Unlock visibility can lag behind its successful response.
                    for (let poll = 0; poll < 5; poll++) {
                      ({ data: item } = await github.rest.issues.get(issue));
                      if (!item.locked) break;
                      await new Promise(resolve => setTimeout(resolve, 1000));
                    }
                  }
                  try { return await write(); }
                  catch (error) {
                    const message = error.response?.data?.message ?? error.message ?? '';
                    if (error.status !== 403 || !/issue is locked/i.test(message)) throw error;
                    // Even a fresh issue read may briefly disagree with the
                    // comment service. Retry only this known lock response.
                    restoreLock = true;
                    lockedResponse = true;
                    ({ data: item } = await github.rest.issues.get(issue));
                    lockReason ??= item.active_lock_reason;
                    if (attempt === 4) throw error;
                    await new Promise(resolve => setTimeout(resolve, 1000));
                  }
                }
              } finally {
                if (restoreLock) await github.rest.issues.lock({ ...issue,
                  ...(lockReason ? { lock_reason: lockReason } : {}) });
              }
            }
            const moderationPath = '.github/workflows/blocked-contributors.yml';
            const validationPath = '.github/workflows/validate-catalog.yml';
            const workflowPath = run => run.path?.split('@')[0];
            async function headChecks(sha) {
              const [checks, statuses, runs] = await Promise.all([
                github.paginate(github.rest.checks.listForRef, { ...context.repo, ref: sha, filter: 'latest', per_page: 100 }),
                github.paginate(github.rest.repos.listCommitStatusesForRef, { ...context.repo, ref: sha, per_page: 100 }),
                github.paginate(github.rest.actions.listWorkflowRunsForRepo, { ...context.repo, head_sha: sha, per_page: 100 })
              ]);
              const exactRuns = runs.filter(run => run.head_sha === sha);
              const suites = new Map(exactRuns.map(run => [run.check_suite_id, run]));
              const latest = new Map();
              function keep(key, item) {
                if (!latest.has(key) || item.id > latest.get(key).id) latest.set(key, item);
              }
              for (const check of checks) {
                if (check.head_sha !== sha || workflowPath(suites.get(check.check_suite?.id) ?? {}) === moderationPath) continue;
                // CodeFactor is advisory; its service can leave reviews pending indefinitely.
                // Match its immutable GitHub App ID, never a caller-controlled check name.
                if (check.app?.id === 25603) continue;
                // Never exclude another app's check merely because it is named moderation.
                const owner = suites.get(check.check_suite?.id)?.workflow_id ?? check.app?.id;
                keep(`check:${owner}:${check.name}`, { id: check.id, name: check.name,
                  pending: check.status !== 'completed', success: check.conclusion === 'success',
                  result: check.conclusion ?? check.status, url: check.html_url });
              }
              for (const status of statuses) {
                keep(`status:${status.context}`, { id: status.id, name: status.context,
                  pending: status.state === 'pending', success: status.state === 'success',
                  result: status.state, url: status.target_url });
              }
              // Also see queued jobs before GitHub has created their check runs.
              const latestRuns = new Map();
              for (const run of exactRuns) {
                if (workflowPath(run) === moderationPath) continue;
                const key = `${run.workflow_id}:${run.event}:${run.head_branch}`;
                if (!latestRuns.has(key) || run.id > latestRuns.get(key).id) latestRuns.set(key, run);
              }
              for (const run of latestRuns.values()) keep(`workflow:${run.workflow_id}:${run.event}:${run.head_branch}`,
                { id: run.id, name: run.name, pending: run.status !== 'completed',
                  success: run.conclusion === 'success', result: run.conclusion ?? run.status, url: run.html_url });
              const registered = [...latestRuns.values()].some(run => workflowPath(run) === validationPath)
                && checks.some(check => check.head_sha === sha && check.name === 'validate'
                  && workflowPath(suites.get(check.check_suite?.id) ?? {}) === validationPath);
              const items = [...latest.values()];
              return { failures: items.filter(item => !item.pending && !item.success),
                pending: !registered || items.some(item => item.pending), registered };
            }
            async function reportCheckFailure(item, failures) {
              // Only this exception is allowed through a failed gate; truthful merge
              // state and human refusal/ban decisions are preserved.
              const labels = new Set(item.labels.map(label => label.name));
              for (const name of item.merged ? ['accepted', 'in review'] : ['accepted', 'merged']) {
                if (labels.has(name)) {
                  try { await github.rest.issues.removeLabel({ ...target, name }); }
                  catch (error) { if (error.status !== 404) throw error; }
                }
              }
              const identity = failures.map(check => [check.name, check.result, check.url]).sort();
              const marker = '<!-- nzik-check-failure ' + item.head.sha + ' ' +
                require('node:crypto').createHash('sha256').update(JSON.stringify(identity)).digest('hex') + ' -->';
              const comments = await github.paginate(github.rest.issues.listComments, { ...target, per_page: 100 });
              if (!comments.some(comment => comment.user?.login === 'github-actions[bot]' && comment.user?.type === 'Bot'
                  && comment.body?.startsWith(marker))) {
                const details = failures.map(check => `- ${check.url ? `[${check.name}](${check.url})` : check.name}: ${check.result}`).join('\n');
                await postComment({ ...target, body: marker + '\n@NEVARLeVrai Checks blocked moderation for commit `' +
                  item.head.sha + '`. Review the failures and accept again after they pass.\n\n' + details });
              }
              core.setFailed('Submission checks are unsuccessful. Publication and cleanup were stopped.');
            }
            async function waitForHeadChecks(expected, approval, attempts = 150) {
              for (let attempt = 0; attempt <= attempts; attempt++) {
                const { data: live } = await github.rest.pulls.get({ ...context.repo, pull_number: pull.number });
                const labels = new Set(live.labels.map(label => label.name));
                if (live.head.sha !== expected.head.sha || live.head.ref !== expected.head.ref ||
                    live.head.repo?.id !== expected.head.repo?.id || live.user.id !== expected.user.id ||
                    live.base.ref !== expected.base.ref || live.state !== expected.state || live.merged !== expected.merged ||
                    (approval && (!labels.has('accepted') || labels.has('refused') || labels.has('ban') ||
                      (await approvalEvent(live.number))?.id !== approval.id))) {
                  core.setFailed('The submission or approval changed while waiting. Review and accept the current revision again.');
                  return null;
                }
                const result = await headChecks(live.head.sha);
                // Close the API-read race before reporting a failure or allowing writes.
                const { data: confirmed } = await github.rest.pulls.get({ ...context.repo, pull_number: pull.number });
                if (confirmed.head.sha !== live.head.sha || confirmed.head.ref !== live.head.ref ||
                    confirmed.head.repo?.id !== live.head.repo?.id || confirmed.user.id !== live.user.id ||
                    confirmed.base.ref !== live.base.ref || confirmed.state !== live.state ||
                    confirmed.merged !== live.merged || confirmed.draft !== live.draft ||
                    JSON.stringify(confirmed.labels.map(label => label.name).sort()) !==
                      JSON.stringify(live.labels.map(label => label.name).sort()) ||
                    (approval && (await approvalEvent(confirmed.number))?.id !== approval.id)) {
                  core.setFailed('The submission changed while checking its checks. Review the current revision.');
                  return null;
                }
                if (result.failures.length) { await reportCheckFailure(confirmed, result.failures); return null; }
                if (!result.pending) return confirmed;
                if (attempt < attempts) await new Promise(resolve => setTimeout(resolve, 10000));
              }
              core.notice('Checks are still pending or catalog validation has not registered. No moderation actions were taken; rerun after checks finish.');
              return null;
            }
            const { data: gateStart } = await github.rest.pulls.get({ ...context.repo, pull_number: pull.number });
            const gateApproval = labelAdded === 'accepted' && !gateStart.merged ? await approvalEvent(pull.number) : null;
            if (labelAdded === 'accepted' && !gateStart.merged &&
                (gateStart.head.sha !== pull.head.sha || !gateApproval || gateApproval.event !== 'labeled' ||
                  gateApproval.label?.name !== 'accepted')) {
              core.setFailed('The approved submission changed. Review and accept the current revision again.');
              return;
            }
            if (gateApproval) {
              // A queued older run must not borrow a later label from an actor
              // who can label issues but is not authorized to publish submissions.
              if (!gateApproval.actor?.login) {
                core.setFailed('The current acceptance has no verifiable maintainer. Review and accept again.');
                return;
              }
              const { data: approvalAccess } = await github.rest.repos.getCollaboratorPermissionLevel({
                ...context.repo, username: gateApproval.actor.login
              });
              if (!['admin', 'maintain', 'write'].includes(approvalAccess.permission)) {
                core.setFailed('The current acceptance was not applied by an authorized maintainer.');
                return;
              }
            }
            const gated = await waitForHeadChecks(gateStart, gateApproval);
            if (!gated) return;
            if (isThemeSubmission && (event.action === 'synchronize' || event.action === 'closed' ||
                (event.action === 'unlabeled' && event.label?.name === 'accepted') ||
                (event.action === 'labeled' && ['refused', 'ban'].includes(event.label?.name)))) {
              for (const { comment, state } of await waitingComments(pull.number)) {
                if (!state.invalid) await saveWaiting(pull.number, { ...state, invalid: true }, comment);
              }
            }
            if (event.action === 'synchronize' && !gated.merged && gated.labels.some(label => label.name === 'accepted')) {
              await github.rest.issues.removeLabel({ ...target, name: 'accepted' });
              core.notice('The revision changed. A maintainer must review and accept it again.');
              return;
            }
            if (event.action === 'unlabeled') return;
            const legacyIndexPath = 'catalog/themes/index.json';
            const currentIndexPath = 'catalog/themes/index-v2.json';
            const themeIndexPaths = [legacyIndexPath, currentIndexPath];
            const { isDeepStrictEqual } = require('node:util');
            async function readFile(path, sha, repository = context.repo) {
              const { data } = await github.rest.repos.getContent({ ...repository, path, ref: sha });
              return Buffer.from(data.content, 'base64');
            }
            const forkRepository = current => ({
              owner: current.head.repo.owner.login, repo: current.head.repo.name
            });
            const manifestPath = /^catalog\/themes\/[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}\/[1-9]\d*\/manifest\.json$/;
            async function validateReservedTags(current, files) {
              const paths = new Set(files.filter(file => file.status !== 'removed' &&
                manifestPath.test(file.filename)).map(file => file.filename));
              if (!paths.size) return;
              const { githubIds } = JSON.parse(await readFile('catalog/creators/verified.json', current.base.sha));
              const verified = new Set(githubIds);
              const reserved = new Set(['stock', 'builtin']);
              for (const path of paths) {
                const manifest = JSON.parse(await readFile(path, current.head.sha, forkRepository(current)));
                const hasReservedTag = manifest.tags.some(tag =>
                  reserved.has(tag.normalize('NFKD').toLowerCase().replace(/[^\p{L}\p{N}]/gu, '')));
                if (hasReservedTag && (!verified.has(pull.user.id) || !verified.has(manifest.author?.githubId))) {
                  throw new Error('Stock and Built-in tags are reserved for verified N-Zik creators.');
                }
              }
            }
            function readThemeIndex(indexPath, sha, repository) {
              return readFile(indexPath, sha, repository).then(bytes => JSON.parse(bytes));
            }
            async function withdrawalIndexes(current, candidate) {
              const files = candidate.changes;
              if (!isWithdrawal || current.head.repo?.owner?.id !== pull.user.id ||
                  current.head.ref !== pull.head.ref ||
                  files.some(file => !themeIndexPaths.includes(file.filename) || file.status !== 'modified')) {
                throw new Error('A theme withdrawal must modify only its catalog indexes from an author-owned withdrawal branch.');
              }
              const themeId = withdrawalBranch[1];
              const removeEntry = index => ({ ...index, themes: index.themes.filter(row => row.themeId !== themeId) });
              const { createHash } = require('node:crypto');
              const repaired = new Map();
              for (const indexPath of themeIndexPaths) {
                const latest = await readThemeIndex(indexPath, current.base.sha);
                const entry = latest.themes.find(row => row.themeId === themeId);
                const changed = files.some(file => file.filename === indexPath);
                if (!entry && !changed) continue;
                if (!entry || !changed) throw new Error('Withdraw the theme from every catalog that lists it.');
                const previous = JSON.parse(candidate.read(candidate.ancestor, indexPath));
                const submitted = JSON.parse(candidate.read(candidate.head, indexPath));
                if (!isDeepStrictEqual(entry, previous.themes.find(row => row.themeId === themeId))) {
                  throw new Error('This theme changed on main. Resubmit the withdrawal from N-Zik.');
                }
                if (!isDeepStrictEqual(removeEntry(previous), submitted)) {
                  throw new Error('A theme withdrawal must remove exactly its own index entry.');
                }
                const bytes = await readFile(`catalog/themes/${themeId}/${entry.revision}/manifest.json`, current.base.sha);
                const manifest = JSON.parse(bytes);
                if (createHash('sha256').update(bytes).digest('hex') !== entry.manifestSha256 ||
                    manifest.themeId !== themeId || manifest.revision !== entry.revision ||
                    manifest.author?.githubId !== pull.user.id) {
                  throw new Error('Only the owner of the published theme may request its withdrawal.');
                }
                repaired.set(indexPath, removeEntry(latest));
              }
              return repaired;
            }
            const themeLabels = ['new theme', 'theme update'];
            const isTheme = item => item.labels.some(label => themeLabels.includes(label.name));
